<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYC Review — True Republic India Admin</title><link rel="icon" type="image/svg+xml" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{background:#f8f5ef}.admin-logo{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 12px}.admin-wrap{max-width:900px;margin:40px auto;padding:0 20px}.admin-wrap .top-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.admin-wrap .top-brand img{width:36px;height:36px;object-fit:contain}.admin-wrap h1{font-family:'Noto Serif Devanagari',serif;font-size:26px;margin-bottom:4px}.admin-wrap p.sub{color:var(--muted);font-size:13px;margin-top:0}.login-box{max-width:340px;margin:80px auto;background:#fff;border:1px solid var(--line);padding:30px;border-radius:6px}.login-box input{border:1px solid #cfd6d3;padding:11px;width:100%;margin:12px 0}.login-box button{background:var(--red);color:#fff;padding:12px;width:100%;font-weight:700;border-radius:4px}.filters{display:flex;gap:8px;margin-bottom:20px}.filters button{background:#eee;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:700}.filters button.active{background:var(--ink);color:#fff}.empty{color:var(--muted);padding:30px 0;text-align:center}.id-info{font-size:13px;color:var(--muted);margin:2px 0}.status-tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}.status-tag.pending{background:#fff6e0;color:#8a6a10}.status-tag.approved{background:#e5f3ee;color:#17695f}.status-tag.rejected{background:#fdeceb;color:var(--red)}</style></head><body><div id="loginScreen" class="login-box"><img class="admin-logo" src="logo.svg" alt="True Republic India logo"><h2 style="font-family:'Noto Serif Devanagari',serif;text-align:center">Admin लॉगिन</h2><p style="color:var(--muted);font-size:13px">KYC सबमिशन देखने और अप्रूव/रिजेक्ट करने के लिए admin पासवर्ड डालें।</p><input id="adminPassword" type="password" placeholder="Admin password"><button id="loginBtn">लॉगिन</button><p id="loginError" style="color:var(--red);font-size:12px"></p></div><div id="adminScreen" class="admin-wrap" style="display:none"><div class="top-brand"><img src="logo.svg" alt="True Republic India logo"><b style="font-family:'Noto Serif Devanagari',serif">True Republic India</b></div><h1>KYC सबमिशन रिव्यू</h1><p class="sub">दस्तावेज़ देखें और सदस्य को अप्रूव या रिजेक्ट करें।</p><div class="filters"><button data-status="pending" class="active">Pending</button><button data-status="approved">Approved</button><button data-status="rejected">Rejected</button><button data-status="">All</button></div><div id="list"></div></div><script src="admin.js"></script></body></html>
